<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Seraph AVSR Demo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 30px; background-color: #f4f4f9; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* 비디오 영역 */
        .video-wrapper { position: relative; width: 100%; max-width: 640px; margin: 0 auto 20px auto; background: #000; border-radius: 8px; overflow: hidden; }
        video { width: 100%; display: block; }
        
        /* 오디오 레벨 미터 */
        #audio-meter-container {
            position: absolute; bottom: 10px; left: 10px; width: 20px; height: 100px;
            background-color: rgba(255, 255, 255, 0.3); border-radius: 10px; overflow: hidden;
            display: flex; flex-direction: column-reverse;
        }
        #audio-meter-bar {
            width: 100%; height: 0%; 
            background-color: #00ff00; transition: height 0.1s;
        }

        button { padding: 12px 24px; font-size: 16px; margin: 10px; cursor: pointer; border: none; border-radius: 5px; color: white; transition: 0.3s; }
        /* [수정] 시작 버튼 초기 색상을 회색으로 (비활성화 느낌) */
        #startBtn { background-color: #ccc; cursor: not-allowed; } 
        #startBtn.ready { background-color: #28a745; cursor: pointer; } /* 준비되면 초록색 */
        
        #stopBtn { background-color: #dc3545; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        #status { margin-top: 20px; font-weight: bold; color: #555; }
        #result-box { margin-top: 20px; padding: 20px; border: 2px solid #007bff; border-radius: 8px; background-color: #e9f5ff; display: none; }
        h3 { margin-top: 0; color: #007bff; }
        .debug-info { font-size: 0.8em; color: #999; margin-top: 10px; }
        
        /* 토글 스위치 스타일 */
        .toggle-container {
            margin: 15px 0; padding: 15px; background: #f8f9fa; border-radius: 8px;
            display: inline-block; border: 1px solid #ddd;
        }
        .toggle-label { font-size: 18px; font-weight: bold; margin-right: 10px; vertical-align: middle; color: #333; }
        #uadfToggle { transform: scale(1.5); vertical-align: middle; cursor: pointer; accent-color: #007bff; }
        .toggle-desc { margin-left: 8px; color: #666; font-size: 0.9em; vertical-align: middle; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ AVSR 추론 데모</h1>
        <p>왼쪽 하단 <b>초록색 막대</b>가 움직여야 소리가 들어가는 것입니다!</p>
        
        <div class="video-wrapper">
            <video id="preview" autoplay muted playsinline></video>
            <div id="audio-meter-container" title="마이크 볼륨">
                <div id="audio-meter-bar"></div>
            </div>
        </div>
        
        <div class="toggle-container">
            <label for="uadfToggle" class="toggle-label">UADF 적용:</label>
            <input type="checkbox" id="uadfToggle">
        </div>
        
        <div>
            <button id="startBtn" disabled>⏳ 모델 로딩 대기 중...</button>
            <button id="stopBtn" disabled>⏹️ 종료 및 전송</button>
        </div>

        <div id="status">웹캠 권한을 확인 중입니다...</div>

        <div id="result-box">
            <h3>추론 결과</h3>
            <p id="result-text" style="font-size: 1.2em; font-weight: bold;">...</p>
        </div>
        <div class="debug-info" id="mime-info"></div>
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let audioContext, analyser, microphone, javascriptNode;
        let isModelReady = false; // 모델 준비 상태 플래그
        
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const resultBox = document.getElementById('result-box');
        const resultText = document.getElementById('result-text');
        const meterBar = document.getElementById('audio-meter-bar');
        const uadfToggle = document.getElementById('uadfToggle');

        // [추가] 서버 상태 주기적 확인 (Polling)
        function checkServerStatus() {
            if (isModelReady) return; // 이미 준비됐으면 그만 확인

            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    console.log("Server Status:", data.status);
                    
                    if (data.status === 'ready') {
                        isModelReady = true;
                        statusDiv.innerText = "✅ 준비됨 (말을 해보세요!)";
                        
                        // 버튼 활성화 및 스타일 변경
                        startBtn.disabled = false;
                        startBtn.innerText = "🔴 녹화 시작";
                        startBtn.classList.add('ready');
                        
                        // 더 이상 확인 안 함
                        if (statusInterval) clearInterval(statusInterval);
                        
                    } else if (data.status === 'loading') {
                        statusDiv.innerText = "⏳ 모델을 GPU에 올리는 중... (약 20~30초)";
                        startBtn.innerText = "⏳ 로딩 중...";
                        startBtn.disabled = true;
                    } else if (data.status === 'error') {
                        statusDiv.innerText = "❌ 서버 모델 로딩 실패 (로그 확인 필요)";
                        if (statusInterval) clearInterval(statusInterval);
                    }
                })
                .catch(err => {
                    console.error("Status Check Error:", err);
                    statusDiv.innerText = "⚠️ 서버 연결 실패 (새로고침 하세요)";
                });
        }

        // 2초마다 상태 확인 시작
        let statusInterval = setInterval(checkServerStatus, 2000);

        // MIME Type 찾기
        function getSupportedMimeType() {
            const types = ['video/webm; codecs=vp9,opus', 'video/webm; codecs=vp8,opus', 'video/webm', 'video/mp4'];
            for (const type of types) {
                if (MediaRecorder.isTypeSupported(type)) return type;
            }
            return '';
        }

        // 웹캠 스트림 연결
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                document.getElementById('preview').srcObject = stream;
                
                // [수정] 웹캠이 켜져도 모델이 안 켜졌으면 대기 멘트 유지
                if (!isModelReady) {
                    statusDiv.innerText = "📷 웹캠 연결됨. 모델 로딩을 기다리는 중...";
                }

                // 오디오 시각화
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    microphone = audioContext.createMediaStreamSource(stream);
                    javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);
                    analyser.smoothingTimeConstant = 0.8;
                    analyser.fftSize = 1024;
                    microphone.connect(analyser);
                    analyser.connect(javascriptNode);
                    javascriptNode.connect(audioContext.destination);

                    javascriptNode.onaudioprocess = function() {
                        var array = new Uint8Array(analyser.frequencyBinCount);
                        analyser.getByteFrequencyData(array);
                        var values = 0;
                        for (var i = 0; i < array.length; i++) values += array[i];
                        var average = values / array.length;
                        meterBar.style.height = Math.min(100, average * 2) + "%";
                        if (average < 5) meterBar.style.backgroundColor = "red";
                        else meterBar.style.backgroundColor = "#00ff00";
                    }
                } catch (e) { console.log("Audio Context Error: ", e); }

                // MediaRecorder 설정
                try {
                    mediaRecorder = new MediaRecorder(stream);
                } catch (e) {
                    console.error("MediaRecorder Init Failed:", e);
                    mediaRecorder = new MediaRecorder(stream); 
                }
                
                const mimeType = getSupportedMimeType();
                document.getElementById('mime-info').innerText = `Using Codec: ${mimeType || 'Default (Safe)'}`;

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };

                mediaRecorder.onstop = uploadVideo;
            })
            .catch(err => {
                console.error(err);
                statusDiv.innerText = "❌ 웹캠/마이크 권한 실패! 설정에서 허용해주세요.";
            });

        startBtn.onclick = () => {
            if (audioContext && audioContext.state === 'suspended') audioContext.resume();
            recordedChunks = [];
            mediaRecorder.start();
            startBtn.disabled = true;
            stopBtn.disabled = false;
            startBtn.classList.remove('ready'); // 녹화 중엔 색상 복귀
            resultBox.style.display = 'none';
            statusDiv.innerText = "녹화 중... (초록 막대가 움직이나요?)";
        };

        stopBtn.onclick = () => {
            mediaRecorder.stop();
            startBtn.disabled = false;
            stopBtn.disabled = true;
            startBtn.classList.add('ready'); // 다시 준비 색상
            statusDiv.innerText = "서버 전송 중...";
        };

        async function uploadVideo() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const formData = new FormData();
            const filename = `avsr_rec_${Date.now()}.webm`;
            
            formData.append("file", blob, filename);
            const isUadf = uadfToggle.checked;
            formData.append("uadf_mode", isUadf); 

            if (isUadf) {
                statusDiv.innerText = "UADF 모델 로딩 및 추론 중... (약간 더 걸릴 수 있음)";
            } else {
                statusDiv.innerText = "GPU 추론 중... (잠시만 기다리세요)";
            }
            
            try {
                const response = await fetch('/upload-video', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if(data.status === 'success') {
                    statusDiv.innerText = "완료!";
                    resultText.innerText = data.inference_result;
                    resultBox.style.display = 'block';
                } else {
                    if(data.status === 'loading') {
                        statusDiv.innerText = "모델이 아직 로딩 중입니다... 잠시만요!";
                    } else {
                        statusDiv.innerText = "에러: " + data.inference_result;
                    }
                }
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "네트워크 에러!";
            }
        }
    </script>
</body>
</html>
